name: 反馈失效或错误
description: 反馈网站失效、跳转异常、名称错误或分类错误
title: "[网站反馈] "
body:
  - type: input
    id: url
    attributes:
      label: 网站 URL
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: 问题类型
      options:
        - 无法访问
        - 跳转到其他网站
        - 网站名称或简介错误
        - 分类错误
        - 其他问题
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 具体情况
      description: 请提供可以帮助核实问题的信息
    validations:
      required: true

